---
# Homelab inventory — single server (quanianitis-01)
# Run: ansible-playbook playbooks/site.yml -i inventory.yml
k3s_cluster:
  children:
    server:
      hosts:
        quanianitis-01:
          ansible_host: quanianitis-01  # Tailscale MagicDNS hostname
          ansible_user: quanianitis
    agent:
      hosts: {}  # add future nodes here

  vars:
    ansible_port: 22
    k3s_version: v1.36.0+k3s1
    token: "{{ lookup('env', 'K3S_TOKEN') }}"
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
    extra_server_args: ""
    cluster_context: quanianitis
    user_kubectl: true

    # Homelab defaults: Traefik + servicelb + local-path enabled
    # GPU runtime configured separately via containerd config template
    # node-ip / advertise-address pinned to IPv4 (2026-07-04): the RTL8812AE WiFi
    # brings up IPv6 SLAAC ~seconds after link-up. If k3s starts before that,
    # etcd fails with `bind: cannot assign requested address` on [2001:...]:2380
    # and the whole server crash-loops until the SLAAC address appears.
    server_config_yaml: |
      cluster-init: true
      node-ip: 192.168.1.50
      advertise-address: 192.168.1.50
      tls-san:
          - 100.100.62.1
      kubelet-arg:
          - "config=/etc/rancher/k3s/kubelet.yaml"

    # Graceful Node Shutdown (KEP-2000). See lessons/kubelet-lifecycle.md.
    # In k8s 1.33+ these fields are config-file-only; passing them as CLI flags
    # (via kubelet-arg) makes k3s crash-loop with "unknown flag".
    # Values: 90s total, 15s reserved for critical pods. Larger than GKE's
    # 60/20 because Longhorn iSCSI volumes need extra time to detach cleanly.
    kubelet_config_yaml: |
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      shutdownGracePeriod: 90s
      shutdownGracePeriodCriticalPods: 15s

    # Must be >= shutdownGracePeriod above. 30s buffer so systemd doesn't
    # yank the inhibitor lock while kubelet is still evicting pods.
    logind_inhibit_delay_max_sec: 120
