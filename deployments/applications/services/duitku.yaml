apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: duitku
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: duitku
    server: https://kubernetes.default.svc
  source:
    path: infra/charts/duitku
    repoURL: https://github.com/ian-cq/homelab.git
    targetRevision: HEAD
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
  # duitku-passwords holds PDF decryption passwords maintained
  # out-of-band via `kubectl -n duitku create configmap ... | kubectl
  # apply -f -` (see configmaps.yaml header). Git carries an empty
  # list as a schema placeholder; without this ignore rule selfHeal
  # would wipe operator-entered passwords on every reconcile.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: duitku-passwords
      namespace: duitku
      jsonPointers:
        - /data
