# Gateway-API HTTPRoute for the duitku Cloudflare-Worker webhook.
#
# Attaches to the `api-https` listener of Gateway `public` (in
# `gateway` ns) via parentRefs.sectionName, inheriting the
# listener-scoped `inbox-apikey` SecurityPolicy. The Cloudflare Email
# Worker presents X-API-Key; OIDC would block it.
#
# Hostname `inbox.api.quanianitis.com` is under the api-https
# listener's wildcard `*.api.quanianitis.com`. Migrated from
# `inbox.62a.quanianitis.com` / `sectionName: inbox` as part of the
# *.api. consolidation (see gateway.yaml preamble). Old `inbox`
# listener stays alive for future use; nothing binds to it.
#
# Only /cf-inbox and /healthz are exposed; everything else 404s at
# envoy. Defence-in-depth: duitku-webhook also enforces HMAC-SHA256
# over (X-Duitku-Timestamp || "." || body).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: duitku-inbox
  labels:
    app.kubernetes.io/name: duitku
    app.kubernetes.io/component: webhook
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: gateway
      sectionName: api-https
  hostnames:
    - inbox.api.quanianitis.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /cf-inbox
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: duitku-webhook
          port: 8080
