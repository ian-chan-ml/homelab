# Runtime configuration for duitku, mounted by the sweep CronJob.
#
# duitku-passwords: TOML list of PDF passwords to try in order. The
# binary tries each against an encrypted PDF until one decrypts.
# Plain ConfigMap (not Secret) per design-doc 2.5/5: these are PII but
# not auth secrets, namespace RBAC is the access boundary, and
# `kubectl edit configmap` is the routine maintenance verb. The
# binary actively redacts these strings from error sidecars and logs.
#
# The data field is maintained OUT-OF-BAND by the operator via:
#
#   kubectl -n duitku create configmap duitku-passwords \
#     --from-file=passwords.toml=./passwords.toml \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The Argo Application (deployments/applications/services/duitku.yaml)
# has an `ignoreDifferences` on `/data` for this ConfigMap so selfHeal
# does not clobber operator edits. The empty list below is the schema
# placeholder Argo applies on first sync.
#
# duitku-accounts: YAML map of bank-side account_id -> Firefly asset
# account name. Required for every account being imported; missing
# entries cause the file to fail rather than guess a wrong target
# account.
apiVersion: v1
kind: ConfigMap
metadata:
  name: duitku-passwords
  labels:
    app.kubernetes.io/name: duitku
data:
  passwords.toml: |
    # /etc/duitku/passwords.toml
    # First successful decrypt wins; order does not matter semantically.
    # Add entries here as new bank PDFs need decoding.
    passwords = [
      # "780101",
      # "010178",
    ]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: duitku-accounts
  labels:
    app.kubernetes.io/name: duitku
data:
  accounts.yaml: |
    # /etc/duitku/accounts.yaml
    # Map account_id (as the parser surfaces it) to the EXACT Firefly
    # asset account name. account_id format is bank-specific; see the
    # parser docstrings in github.com/ian-cq/duitku.
    # Keys are the trailing 4 digits of the bank-side account / card
    # number (see extract_account_id in each parser). Values are the
    # EXACT Firefly asset account names (from terraform-firefly output,
    # 2026-07-05). The maybank parser handles both the savings account
    # and the Maybank-issued credit card, so both live under `maybank:`.
    #
    # TNG eWallet (last-4 "1583") and the revenue accounts Salary /
    # Reimbursements are intentionally omitted: TNG has no parser yet,
    # and revenue accounts are transaction destinations, not sources
    # keyed by account_id.
    maybank:
      "1760": "Maybank"
      "4868": "Maybank Credit"
    uob:
      "8029": "UOB Credit"
    ryt:
      "3918": "RytBank"
