# Postgres backing store for n8n.
#
# Single-replica, longhorn-backed. Pinned to postgres:16.4-alpine to
# match the version used by the firefly stack (one image tag pulled,
# node cache reuse). n8n supports Postgres 12+ per docs.
#
# StorageClass explicitly set to longhorn because the cluster has two
# default StorageClasses (local-path and longhorn) and PVC binding is
# otherwise ambiguous - same trap documented in infra/charts/plane and
# infra/charts/firefly.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-postgres-data
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-postgres
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: postgres
data:
  # Non-secret DB bootstrap env. POSTGRES_PASSWORD is not here — it
  # comes from the cluster-wide shared Secret via secretKeyRef on the
  # Deployment below.
  POSTGRES_DB: "n8n"
  POSTGRES_USER: "n8n"
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-postgres
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-postgres
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - configMapRef:
                name: n8n-postgres
          env:
            # POSTGRES_PASSWORD sourced from the cluster-wide shared
            # Secret; POSTGRES_DB and POSTGRES_USER are non-secret and
            # live in the n8n-postgres ConfigMap alongside PGDATA below.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-homelab-secrets
                  key: n8n-db-password
            # Default PGDATA is /var/lib/postgresql/data which is also
            # the mountpoint; postgres refuses to init there because the
            # mount creates a non-empty lost+found. Subdir avoids that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - n8n
                - -d
                - n8n
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - n8n
                - -d
                - n8n
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-postgres-data
