# n8n application (single "main" process; no separate worker/webhook
# split - fine for a personal-scale homelab, can be scaled out later by
# adding EXECUTIONS_MODE=queue + a dedicated worker Deployment + Redis).
#
# Pinned to n8nio/n8n:2.29.5 (Docker Hub, released 2026-07-03; latest
# stable at deploy time). Rotate the tag deliberately; n8n releases
# weekly and occasionally ships breaking migrations.
#
# Storage:
# - /home/node/.n8n: n8n binary data / installed community nodes /
#   local files. PVC. Do NOT store credentials here (they live in
#   Postgres, encrypted with N8N_ENCRYPTION_KEY from the secret).
#
# Environment:
# - DB_TYPE=postgresdb + DB_POSTGRESDB_* wire n8n to the sibling
#   Postgres Service. Password is injected from the n8n-app Secret.
# - N8N_HOST / N8N_PROTOCOL / WEBHOOK_URL / N8N_EDITOR_BASE_URL must
#   all reflect the public origin exactly. Webhook URLs generated by
#   n8n use WEBHOOK_URL as their base; if this is wrong, incoming
#   webhooks from third parties will 404 at the edge.
# - N8N_PROXY_HOPS=1 tells n8n to trust one X-Forwarded-* hop (Envoy
#   Gateway). Without this, IP-based rate limits and audit logs record
#   the proxy IP instead of the caller.
# - N8N_SECURE_COOKIE=true is required when serving over HTTPS; the
#   default in newer n8n is true anyway, set explicitly for clarity.
# - N8N_RUNNERS_ENABLED=true opts into the task-runner architecture
#   that n8n has been migrating to; leaving it false triggers a
#   deprecation warning on every start in 1.x/2.x releases.
# - N8N_BLOCK_ENV_ACCESS_IN_NODE=true prevents workflow code from
#   reading pod env vars (which would expose N8N_ENCRYPTION_KEY etc.).
# - N8N_GIT_NODE_DISABLE_BARE_REPOS=true silences another deprecation
#   nag that fires on every start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-app
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: app
data:
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "n8n-postgres"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n"
  DB_POSTGRESDB_USER: "n8n"
  N8N_HOST: "n8n.62a.quanianitis.com"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "https"
  N8N_EDITOR_BASE_URL: "https://n8n.62a.quanianitis.com/"
  WEBHOOK_URL: "https://n8n.62a.quanianitis.com/"
  N8N_PROXY_HOPS: "1"
  N8N_SECURE_COOKIE: "true"
  N8N_RUNNERS_ENABLED: "true"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
  GENERIC_TIMEZONE: "Asia/Singapore"
  TZ: "Asia/Singapore"
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5678
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    # n8n keeps live websocket connections to running workflows;
    # rolling would double-run schedule triggers for the overlap
    # window. Recreate is safer for a single-instance deploy.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/component: app
    spec:
      securityContext:
        # n8n image runs as uid 1000 (node). fsGroup lets it write to
        # the longhorn-mounted data dir.
        fsGroup: 1000
      containers:
        - name: n8n
          image: n8nio/n8n:2.29.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
          envFrom:
            - configMapRef:
                name: n8n-app
          env:
            # Secrets sourced from the cluster-wide `shared-homelab-secrets`
            # Secret (see infra/kustomize/external-secrets/). Explicit
            # per-key `secretKeyRef` (not `envFrom: secretRef`) so only
            # the two keys this container needs land in its env — the
            # shared Secret carries other apps' credentials too and we
            # don't want them fanned into unrelated processes.
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: shared-homelab-secrets
                  key: n8n-encryption-key
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-homelab-secrets
                  key: n8n-db-password
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
