# Secrets for n8n + its Postgres.
#
# Generated locally with `openssl rand -hex` on 2026-07-04. These should
# eventually move to 1Password via external-secrets; tracked as a
# followup, mirroring the plane / firefly setup.
#
# - N8N_ENCRYPTION_KEY: 48-char hex used to encrypt stored credentials
#   in the n8n database. MUST NOT change after first boot: existing
#   credential rows are AES-encrypted with this key and become
#   unrecoverable if it is rotated in place. To rotate safely, use the
#   n8n CLI (`n8n export:credentials --decrypted`, rotate key, re-import).
# - DB_PASSWORD: postgres app-user password. Kept identical in both
#   secrets so a single value covers both the DB init and the n8n
#   connection string.
apiVersion: v1
kind: Secret
metadata:
  name: n8n-app
  labels:
    app.kubernetes.io/name: n8n
type: Opaque
stringData:
  N8N_ENCRYPTION_KEY: "52af57d8f811cb7adf5d53cc03308a7e6885cc3bee942f2d"
  DB_POSTGRESDB_PASSWORD: "ea8a0aa1fc21e15297a2beaef6aaaf42"
---
apiVersion: v1
kind: Secret
metadata:
  name: n8n-postgres
  labels:
    app.kubernetes.io/name: n8n
type: Opaque
stringData:
  POSTGRES_DB: "n8n"
  POSTGRES_USER: "n8n"
  POSTGRES_PASSWORD: "ea8a0aa1fc21e15297a2beaef6aaaf42"
