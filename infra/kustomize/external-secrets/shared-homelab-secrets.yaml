# Central "shared homelab secrets" bundle.
#
# ONE ExternalSecret, sourced from ONE 1Password item
# (`shared-homelab-secrets` in vault `quanianitis.com`), producing
# ONE Kubernetes Secret (`shared-homelab-secrets` in the
# `external-secrets` namespace) that emberstack/reflector then
# mirrors into every namespace of the cluster.
#
# See infra/kustomize/reflector/ for the reflector controller and
# SECRET_ROTATION.md for the 1Password item schema and the Phase 2
# consumer migration checklist.
#
# `dataFrom.extract` pulls *every field* from the 1P item, so
# adding a new key in 1Password automatically shows up as a key in
# the reflected Secret cluster-wide without touching this manifest.
# Field labels in 1Password become Secret data keys verbatim
# (kebab-case recommended for portability across shells/env-vars).
#
# The reflector annotations on `spec.target.template.metadata`
# are what triggers replication. `reflection-allowed=true` lets
# reflector read the source. `reflection-auto-enabled=true` +
# `reflection-auto-namespaces=""` (empty = all namespaces) causes
# reflector to auto-create a mirror in every namespace and keep it
# in sync when new namespaces are created.
#
# creationPolicy: Owner means ESO fully owns the target Secret;
# if the Secret is deleted, ESO recreates it on the next refresh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shared-homelab-secrets
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: shared-homelab-secrets
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: ""
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: ""
        labels:
          app.kubernetes.io/name: shared-homelab-secrets
          app.kubernetes.io/managed-by: external-secrets
  dataFrom:
    - extract:
        key: shared-homelab-secrets
