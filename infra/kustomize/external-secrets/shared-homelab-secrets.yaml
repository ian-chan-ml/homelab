# Central "shared homelab secrets" bundle.
#
# ONE ExternalSecret, sourced from ONE 1Password item
# (`shared-homelab-secrets` in vault `quanianitis.com`), producing
# ONE Kubernetes Secret (`shared-homelab-secrets` in the
# `external-secrets` namespace) that emberstack/reflector then
# mirrors into every namespace of the cluster.
#
# See infra/kustomize/reflector/ for the reflector controller and
# SECRET_ROTATION.md for the 1Password item schema and the Phase 2
# consumer migration checklist.
#
# Uses explicit `data:` blocks (NOT `dataFrom.extract`) so only the
# fields listed here are projected into the reflected Secret. This
# matters because 1Password items — especially those created as
# `--category=login` — carry built-in fields like `username`,
# `password`, `notesPlain` that would otherwise be fanned out to
# every namespace in the cluster (including `default`, `kube-public`)
# and become a leak surface. Explicit projection means:
#   - Adding a new key requires editing this manifest (deterministic).
#   - 1P item can be any category / can hold arbitrary extras without
#     polluting the cluster.
# Field labels in 1Password must exactly match the `remoteRef.property`
# strings below (kebab-case recommended for portability across
# shells/env-vars).
#
# The reflector annotations on `spec.target.template.metadata`
# are what triggers replication. `reflection-allowed=true` lets
# reflector read the source. `reflection-auto-enabled=true` +
# `reflection-auto-namespaces=""` (empty = all namespaces) causes
# reflector to auto-create a mirror in every namespace and keep it
# in sync when new namespaces are created.
#
# creationPolicy: Owner means ESO fully owns the target Secret;
# if the Secret is deleted, ESO recreates it on the next refresh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shared-homelab-secrets
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: shared-homelab-secrets
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: ""
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: ""
        labels:
          app.kubernetes.io/name: shared-homelab-secrets
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: n8n-encryption-key
      remoteRef:
        key: shared-homelab-secrets
        property: n8n-encryption-key
    - secretKey: n8n-db-password
      remoteRef:
        key: shared-homelab-secrets
        property: n8n-db-password
    - secretKey: firefly-app-key
      remoteRef:
        key: shared-homelab-secrets
        property: firefly-app-key
    - secretKey: firefly-static-cron-token
      remoteRef:
        key: shared-homelab-secrets
        property: firefly-static-cron-token
    - secretKey: firefly-db-password
      remoteRef:
        key: shared-homelab-secrets
        property: firefly-db-password
    - secretKey: firefly-pat-token
      remoteRef:
        key: shared-homelab-secrets
        property: firefly-pat-token
