# Central "shared homelab secrets" bundle.
#
# ONE ExternalSecret, sourced from ONE 1Password item
# (`shared-homelab-secrets` in vault `quanianitis.com`), producing
# ONE Kubernetes Secret (`shared-homelab-secrets` in the
# `external-secrets` namespace) that emberstack/reflector then
# mirrors into every namespace of the cluster.
#
# See infra/kustomize/reflector/ for the reflector controller and
# SECRET_ROTATION.md for the 1Password item schema and the Phase 2
# consumer migration checklist.
#
# Uses `dataFrom.extract` to project *every* field from the 1P item
# into the Secret, so adding a new key is a pure 1Password operation
# (no manifest edit, no Argo sync, just wait for the next refresh or
# annotate `force-sync`). Tradeoff / operating rule:
#   - The `shared-homelab-secrets` 1P item MUST NOT be a `login`
#     category item — those carry implicit `username`, `password`,
#     `notesPlain` fields that would leak into every namespace.
#     Use `--category=password` or `--category=api-credential` or a
#     custom category that only exposes explicitly-added fields.
#   - Every field on the item is fanned out to every namespace via
#     reflector. Do not put anything on this item that isn't safe to
#     expose to every workload in the cluster.
#   - Field labels in 1P become Secret data keys verbatim. Prefer
#     kebab-case for portability across shells and env-var mappers.
#
# The reflector annotations on `spec.target.template.metadata` are
# what triggers replication. `reflection-allowed=true` lets reflector
# read the source. `reflection-auto-enabled=true` +
# `reflection-auto-namespaces=""` (empty = all namespaces) causes
# reflector to auto-create a mirror in every namespace and keep it
# in sync when new namespaces are created.
#
# creationPolicy: Owner means ESO fully owns the target Secret;
# if the Secret is deleted, ESO recreates it on the next refresh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shared-homelab-secrets
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: shared-homelab-secrets
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: ""
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: ""
        labels:
          app.kubernetes.io/name: shared-homelab-secrets
          app.kubernetes.io/managed-by: external-secrets
  dataFrom:
    - extract:
        key: shared-homelab-secrets
