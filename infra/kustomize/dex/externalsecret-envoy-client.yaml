# ExternalSecret: Dex↔Envoy Gateway static-client credential.
#
# Sources from the ONE shared 1Password item `shared-homelab-secrets`
# in vault `quanianitis.com` — not a dedicated dex item. There is
# exactly one 1P item for the entire cluster; app-specific fields
# live inside it with kebab-cased, app-prefixed labels
# (`dex-envoy-client-id`, `dex-envoy-client-secret`).
#
# Why this file exists at all when we already have a cluster-wide
# reflected `shared-homelab-secrets` Secret in every namespace:
#   - The Envoy Gateway SecurityPolicy `clientIDRef` / `clientSecret`
#     fields point at a Secret and read hard-coded data keys
#     (`client-id`, `client-secret`) with no key override. It cannot
#     be pointed at `shared-homelab-secrets` directly because those
#     generic key names would collide across every OIDC client we
#     ever want to store (Google, Dex, future upstreams…).
#   - This ExternalSecret is therefore a *shape-projecting projection*:
#     it re-emits two fields from the shared 1P item into a Secret
#     with the exact key names the consumer expects.
#
# Same pattern applies to any third-party chart or Gateway-API
# controller that hard-codes Secret key names. The 1P item stays
# singular; the k8s manifests do the shape-fitting.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-client-envoy
  namespace: gateway
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/component: static-client-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: dex-client-envoy
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: shared-homelab-secrets
        property: dex-envoy-client-id
    - secretKey: client-secret
      remoteRef:
        key: shared-homelab-secrets
        property: dex-envoy-client-secret
