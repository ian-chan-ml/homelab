# ExternalSecret: Dex↔Envoy Gateway static-client credential.
#
# Sources from the 1Password item `gateway-homelab-auth` in vault
# `quanianitis.com` via the shared `1password` ClusterSecretStore.
#
# Why a dedicated 1P item (not part of `shared-homelab-secrets`):
#   - `shared-homelab-secrets` groups app-level cross-cutting values
#     (DB passwords, encryption keys, app tokens) that get reflected
#     cluster-wide to every namespace.
#   - `gateway-homelab-auth` groups north-south auth material for the
#     Envoy Gateway (OIDC clients, HMAC secrets, upstream IdP creds).
#     Distinct rotation cadence, distinct blast radius, distinct
#     audit story.
#   - One ClusterSecretStore, N 1P items, grouped by concern.
#
# Field layout: the item holds exactly `client-id` and `client-secret`
# — the literal key names Envoy Gateway's SecurityPolicy hard-codes.
# `dataFrom.extract` re-emits every field verbatim, so no explicit
# remap block is needed. If the item later grows to hold multiple
# OIDC clients, switch to explicit `data:` blocks with prefixed
# 1P field labels (`dex-envoy-*`, `google-*`, etc.) and per-consumer
# ExternalSecret projections.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-client-envoy
  namespace: gateway
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/component: static-client-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: dex-client-envoy
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: gateway-homelab-auth
