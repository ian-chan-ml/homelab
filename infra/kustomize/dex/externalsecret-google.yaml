apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-oauth-client-dex
  namespace: gateway
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/component: upstream-idp-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  # The pre-existing `google-oauth-client` Secret (created out-of-band
  # for the previous direct-to-Google OIDC SecurityPolicy) is unmanaged
  # by ExternalSecrets. To avoid the "cannot adopt existing Secret"
  # failure mode, this ExternalSecret writes to a distinct target name;
  # Dex's envVars reference `google-oauth-client-dex`. Once the legacy
  # Secret is deleted post-cutover, this can be renamed if desired.
  target:
    name: google-oauth-client-dex
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: google-oauth-web-client
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: google-oauth-web-client
        property: client-secret
