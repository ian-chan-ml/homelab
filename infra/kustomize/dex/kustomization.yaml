# Dex is the in-cluster OIDC identity broker. It plays the role that IAP
# plays on GKE and ALB-OIDC plays on ACK: the *single* OAuth 2.0 Web
# Client registered with Google, so per-hostname `/oauth2/callback`
# entries no longer need to be maintained by hand in the Google Console.
#
# Chain:
#   user browser
#     → Envoy Gateway (public-oidc SecurityPolicy, OIDC client of Dex)
#     → Dex     (auth.62a.quanianitis.com, upstream OIDC client of Google)
#     → Google  (issues id_token, only redirect URI is Dex's /callback)
#
# The Google Console for OAuth Client
# `114204026619-8ompnjl85l2muhs6dr490tkkctrft6g6.apps.googleusercontent.com`
# now only needs ONE redirect URI: https://auth.62a.quanianitis.com/callback
# Every per-app callback moves into `staticClients[0].redirectURIs` below
# in `values.yaml` — declarative, in git, syncs via Argo.
#
# Deployed into the `gateway` namespace alongside the Envoy Gateway
# resources it serves. This lets the Dex-issued Secret `dex-client-envoy`
# be referenced directly by both Dex (as the static client credential)
# and by the Envoy `SecurityPolicy` (as `clientIDRef` / `clientSecret`)
# without cross-namespace duplication, AND lets Dex read the existing
# `gateway/google-oauth-client` Secret directly for its upstream
# Google connector — no separate copy needed.
#
# ---- Secrets ------------------------------------------------------
#
#   1. `gateway/google-oauth-client` (OUT-OF-BAND, unchanged)
#      Was created out-of-band for the previous direct-to-Google OIDC
#      SecurityPolicy. Same shape Dex needs. Nothing to do — just
#      re-verify:
#        kubectl -n gateway get secret google-oauth-client \
#          -o jsonpath='{.data.client-id}'     | base64 -d
#        # → 114204026619-…apps.googleusercontent.com
#        kubectl -n gateway get secret google-oauth-client \
#          -o jsonpath='{.data.client-secret}' | base64 -d
#        # → GOCSPX-…
#      Ensure the Prune=false annotation is set so Argo doesn't delete
#      it once the old SecurityPolicy references disappear:
#        kubectl annotate secret -n gateway google-oauth-client \
#          argocd.argoproj.io/sync-options=Prune=false --overwrite
#      Followup: migrate this to its own ExternalSecret pointed at 1P
#      item `google-oauth-client` — same pattern as dex-client-envoy
#      below. Kept out-of-band today because the 1P item isn't seeded.
#
#   2. `gateway/dex-client-envoy` (ExternalSecret + 1Password)
#      Static client credential Dex issues to the Envoy Gateway
#      public-oidc SecurityPolicy. Managed by ESO — see
#      externalsecret-envoy-client.yaml. Sourced from the SHARED 1P
#      item `shared-homelab-secrets` in vault `quanianitis.com`,
#      fields `dex-envoy-client-id` + `dex-envoy-client-secret`. This
#      ExternalSecret projects those two fields into a Secret shaped
#      the way Envoy Gateway's SecurityPolicy expects (`client-id` /
#      `client-secret` — hard-coded key names, no override). One 1P
#      item for the whole cluster; app-specific fields live inside it.
#
#      Add the two fields to the shared 1P item from the current live
#      values with:
#        op item edit shared-homelab-secrets --vault quanianitis.com \
#          "dex-envoy-client-id[text]=$(kubectl get secret -n gateway dex-client-envoy \
#              -o jsonpath='{.data.client-id}' | base64 -d)" \
#          "dex-envoy-client-secret[password]=$(kubectl get secret -n gateway dex-client-envoy \
#              -o jsonpath='{.data.client-secret}' | base64 -d)"
#      then delete the out-of-band Secret so ESO can create it fresh
#      with itself as owner:
#        kubectl delete secret -n gateway dex-client-envoy
#      (Brief auth gap on the public-oidc listener — ~seconds while
#      ESO reconciles; schedule accordingly.)
#
#      The client-id string `envoy-gateway` MUST match
#      staticClients[0].id in values.yaml. The client-secret value is
#      never referenced elsewhere — Dex reads it via envVar, Envoy
#      reads it via clientSecretRef, both point at this same Secret.
#
# ---- Google Console prereq -----------------------------------------
#
#   3. Add https://auth.62a.quanianitis.com/callback to the Authorized
#      redirect URIs list on OAuth Client
#      114204026619-…apps.googleusercontent.com. Leave the existing
#      per-host callbacks in place until the SecurityPolicy migration
#      has been verified end-to-end; then strip them out, leaving only
#      the Dex callback.
#
# ---- Storage note --------------------------------------------------
#
# `storage.type: memory` in values.yaml keeps Dex stateless. Trade-off
# is that all Dex replicas would each hold their own OAuth code-flow
# session state, so the callback must land on the same replica that
# started the flow. We run replicaCount=1 for that reason. If you
# scale up, switch storage to `type: kubernetes` (CRD-backed shared
# state).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gateway

resources:
  - httproute.yaml
  - externalsecret-envoy-client.yaml

helmCharts:
  - name: dex
    repo: https://charts.dexidp.io
    version: 0.24.1        # appVersion 2.44.0
    releaseName: dex
    namespace: gateway
    valuesFile: values.yaml
