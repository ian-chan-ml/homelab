# JobSet operator (kubernetes-sigs/jobset)
# Installs controller/webhook into kube-system to sit alongside other core operators
# (cert-manager, nvidia-device-plugin, local-path-provisioner).
#
# Upstream ships a fully-rendered manifest per release; we relocate every
# namespaced resource from `jobset-system` → `kube-system` via kustomize's
# namespace transformer (verified to rewrite webhook clientConfig.service.namespace
# and RoleBinding subjects, not just metadata.namespace).
#
# Pin: v0.12.0 (2026-06 release, matches JobSet API v1alpha2).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
  - https://github.com/kubernetes-sigs/jobset/releases/download/v0.12.0/manifests.yaml
