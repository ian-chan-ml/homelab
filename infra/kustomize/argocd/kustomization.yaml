apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - certificate.yaml
  - httproute.yaml

helmCharts:
  # Chart 10.0.0 ships Argo CD v3.4.4 by default. We override
  # `global.image.tag` to v3.5.0-rc2 in values.yaml — see the comment there
  # for the full rationale. Bump the chart version when a chart with
  # appVersion >= v3.5.0 GA is published, and drop the image override.
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.0.0
    releaseName: argocd
    namespace: argocd
    includeCRDs: true
    valuesFile: values.yaml
