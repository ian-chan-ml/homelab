# ExternalSecret: consolidated north-south gateway auth material.
#
# Sources from the 1Password item `gateway-homelab-auth` in vault
# `quanianitis.com` via the shared `1password` ClusterSecretStore.
# The 1P item is the "one item per concern" bucket for gateway auth
# (OIDC client credentials, API keys, HMAC secrets) — see
# infra/kustomize/external-secrets/SECRET_ROTATION.md §
# "Shape-projection sub-pattern".
#
# Field mapping (1P field label → K8s Secret data key):
#   apikey-gateway → apikey-gateway
#
# 1P field labels stay app-prefixed (`apikey-*`, `oidc-*`, ...) to
# avoid collisions inside the multi-tenant 1P item; here the 1P label
# and the K8s data key coincide because there is only one api-key
# concern per gateway right now. EG's `inbox-apikey` SecurityPolicy
# forwards the matched key name upstream as `x-client-id`, so
# duitku's access logs and any downstream dashboards / rate-limiting
# will see `apikey-gateway` once this Secret is added to the SP's
# `credentialRefs`. That is a deliberate rename from the legacy
# `cf-worker` — the Cloudflare Email Worker is not the only future
# consumer of this credential, so the audit-trail label should
# describe the gateway credential, not the specific caller.
#
# creationPolicy: Owner — ESO owns the target Secret and recreates
# it if deleted. This is a NEW Secret name (`gateway-homelab-auth`),
# not an adoption of the legacy `gateway-api-key`, so there is no
# "creationPolicy adoption" foot-gun (ESO refuses to adopt Secrets
# not already owned by an ExternalSecret).
#
# Migration history (kept for context; the migration is now complete):
#
#   Phase 1: ExternalSecret manifest lands. Target Secret does not yet
#     exist because the 1P field `apikey-gateway` is not yet populated.
#     ES reports SecretSyncedError. `inbox-apikey.credentialRefs` still
#     references only the legacy `gateway-api-key` Secret, so
#     cluster auth continues to work against the legacy value.
#
#     Do NOT list an unmaterialised Secret in
#     `SecurityPolicy.spec.apiKeyAuth.credentialRefs`. Envoy Gateway
#     marks the whole SP `Accepted=False reason=Invalid` on any
#     missing credentialRef, and an Invalid SP fails OPEN — traffic
#     reaches the backend unauthenticated on every targeted listener.
#
#   Phase 2 (Ian, out-of-band): populate 1P field `apikey-gateway`:
#       op read 'op://quanianitis.com/gateway-api-key-inbox/cf-worker' \
#         | op item edit gateway-homelab-auth \
#             --vault quanianitis.com \
#             "apikey-gateway[password]=$(cat)"
#     …or mint a fresh value with `python3 -c 'import secrets;
#     print(secrets.token_urlsafe(32), end="")'`. Force-refresh:
#       kubectl annotate externalsecret -n gateway gateway-homelab-auth \
#         force-sync=$(date +%s) --overwrite
#     Verify:
#       kubectl get secret -n gateway gateway-homelab-auth \
#         -o jsonpath='{.metadata.ownerReferences[0].kind}{"\n"}'
#       # expect: ExternalSecret
#
#   Phase 3: add `gateway-homelab-auth` to
#     `inbox-apikey.credentialRefs` alongside the legacy Secret.
#     EG unions data keys — both legacy and new values authenticate.
#
#   Phase 4 (this end state): re-point every caller of the legacy
#     value at the new value (e.g. `wrangler secret put GATEWAY_API_KEY`
#     for the Cloudflare Email Worker), then drop `gateway-api-key`
#     from credentialRefs and `kubectl delete secret -n gateway
#     gateway-api-key`. Done.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-homelab-auth
  namespace: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api-key-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: gateway-homelab-auth
    creationPolicy: Owner
  data:
    - secretKey: apikey-gateway
      remoteRef:
        key: gateway-homelab-auth
        property: apikey-gateway
