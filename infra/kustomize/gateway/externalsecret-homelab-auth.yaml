# ExternalSecret: consolidated north-south gateway auth material.
#
# Sources from the 1Password item `gateway-homelab-auth` in vault
# `quanianitis.com` via the shared `1password` ClusterSecretStore.
# The 1P item is the "one item per concern" bucket for gateway auth
# (OIDC client credentials, API keys, HMAC secrets) — see
# infra/kustomize/external-secrets/SECRET_ROTATION.md §
# "Shape-projection sub-pattern".
#
# Field mapping (1P field label → K8s Secret data key):
#   apikey-cf-worker → cf-worker
#
# The K8s data key name stays `cf-worker` to preserve the upstream
# audit trail: EG's `inbox-apikey` SecurityPolicy forwards the matched
# key name as `x-client-id`, so keeping the name means duitku webhook
# access logs continue to record `cf-worker` and any downstream
# dashboards / rate-limiting keyed on that value are unchanged.
#
# 1P field labels stay app-prefixed (`apikey-*`, `oidc-*`, ...) to
# avoid collisions inside the multi-tenant 1P item; the mapping is
# what decouples the two namespaces.
#
# creationPolicy: Owner — ESO owns the target Secret and recreates
# it if deleted. This is a NEW Secret name (`gateway-homelab-auth`),
# not an adoption of the legacy `gateway-api-key`, so there is no
# "creationPolicy adoption" foot-gun (ESO refuses to adopt Secrets
# not already owned by an ExternalSecret).
#
# Migration path:
#   Phase 1 (this commit): ES lands; SecurityPolicy `inbox-apikey`
#     lists BOTH the legacy `gateway-api-key` Secret and this new
#     `gateway-homelab-auth` Secret in credentialRefs. Whichever key
#     value the caller presents authenticates. Zero-downtime.
#   Phase 2 (Ian, out-of-band): populate 1P field `apikey-cf-worker`
#     with the current cluster value:
#       op read 'op://quanianitis.com/gateway-api-key-inbox/cf-worker' \
#         | op item edit gateway-homelab-auth \
#             --vault quanianitis.com \
#             "apikey-cf-worker[password]=$(cat)"
#     Force-refresh the ExternalSecret so the target Secret
#     materialises:
#       kubectl annotate externalsecret -n gateway gateway-homelab-auth \
#         force-sync=$(date +%s) --overwrite
#   Phase 3 (follow-up commit): drop the legacy `gateway-api-key`
#     from credentialRefs, `kubectl delete secret -n gateway
#     gateway-api-key`, remove the SECRET_ROTATION.md interim block.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-homelab-auth
  namespace: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api-key-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: gateway-homelab-auth
    creationPolicy: Owner
  data:
    - secretKey: cf-worker
      remoteRef:
        key: gateway-homelab-auth
        property: apikey-cf-worker
