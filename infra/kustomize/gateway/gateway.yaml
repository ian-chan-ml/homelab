# Three listeners share port 443 with distinct hostnames. Per Gateway-API,
# more-specific hostname wins at request dispatch, so a request to
# inbox.62a.quanianitis.com hits the `inbox` listener (not the wildcard),
# and auth.62a.quanianitis.com hits the `dex` listener.
#
# Each listener has its own SecurityPolicy:
#   - https     ← public-oidc  (Dex OIDC + email allowlist)   [gateway-wide SP]
#   - inbox     ← inbox-apikey (X-API-Key header)             [sectionName-scoped SP]
#   - ray-api   ← inbox-apikey (X-API-Key header)             [sectionName-scoped SP]
#   - api-https ← inbox-apikey (X-API-Key header)             [sectionName-scoped SP]
#   - dex       ← dex-noauth   (no auth; Dex is the IdP)      [sectionName-scoped SP]
#
# EG resolves SecurityPolicy specificity as listener > gateway, so the
# inbox / ray-api / api-https / dex listeners' SPs override the
# gateway-wide OIDC for routes attached via parentRefs[].sectionName.
# The public-oidc policy gets a `PolicyConditionOverridden: true` status
# for those sections — that's expected, not a bug.
#
# The `dex` listener is unauthenticated on purpose: Dex is our OIDC IdP,
# so authenticating access to its own /authorize, /token, /keys,
# /.well-known/openid-configuration and /callback endpoints against
# itself would deadlock login. This mirrors how GKE exposes IAP's
# handleRedirect endpoint or how ALB exposes its OIDC callback path —
# the identity broker's own surface must be reachable unauthenticated.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.62a.quanianitis.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: wildcard-62a-quanianitis-com-tls
      allowedRoutes:
        namespaces:
          from: All
    # Dedicated listener for machine-to-machine webhooks that can't
    # present a Google OIDC JWT (e.g. Cloudflare Email Workers).
    # Routes attach via `parentRefs[].sectionName: inbox` and inherit
    # the inbox-apikey SecurityPolicy. TLS reuses the wildcard cert
    # since `*.62a` covers `inbox.62a`.
    - name: inbox
      protocol: HTTPS
      port: 443
      hostname: "inbox.62a.quanianitis.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: wildcard-62a-quanianitis-com-tls
      allowedRoutes:
        namespaces:
          from: All
    # Dedicated listener for Dex, the in-cluster OIDC IdP that fronts
    # Google for all other public HTTPRoutes. Must be reachable
    # unauthenticated because it *is* the authenticator — see
    # securitypolicy-dex.yaml. Only the Dex HTTPRoute in this repo
    # (infra/kustomize/dex/httproute.yaml) binds here via
    # `parentRefs[].sectionName: dex`. TLS reuses the wildcard cert
    # since `*.62a` covers `auth.62a`.
    - name: dex
      protocol: HTTPS
      port: 443
      hostname: "auth.62a.quanianitis.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: wildcard-62a-quanianitis-com-tls
      allowedRoutes:
        namespaces:
          from: All
    # Dedicated listener for the Ray cluster's HTTP API (dashboard
    # port 8265: Job Submission API, State API, Serve control plane).
    # Shares the `inbox-apikey` SecurityPolicy with the `inbox`
    # listener — same X-API-Key auth against the `gateway-api-key`
    # Secret, just a different hostname. Routes bind via
    # `parentRefs[].sectionName: ray-api`. TLS reuses the wildcard
    # cert since `*.62a` covers `ray-api.62a`.
    #
    # Deliberately separate from `ray-ctrl.62a` (OIDC-gated browser
    # dashboard): programmatic clients cannot complete an OIDC
    # redirect, and a static X-API-Key is the minimum-viable option.
    - name: ray-api
      protocol: HTTPS
      port: 443
      hostname: "ray-api.62a.quanianitis.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: wildcard-62a-quanianitis-com-tls
      allowedRoutes:
        namespaces:
          from: All
    # Wildcard listener for the machine-to-machine API surface. Every
    # `<svc>.api.quanianitis.com` route attaches here via
    # `parentRefs[].sectionName: api-https` and inherits the
    # listener-scoped `inbox-apikey` SecurityPolicy (X-API-Key against
    # the `gateway-homelab-auth` Secret) instead of the gateway-wide
    # `public-oidc`.
    #
    # Rationale (see also `~/claude-agent/logs/2026-07-05-*` for the
    # full design discussion): consolidating apikey callers onto their
    # own zone (`*.api.` on the public brand) rather than the mixed
    # `*.62a.` homelab zone makes the naming self-documenting
    # (a `.api.` hostname always means machine-to-machine, apikey,
    # JSON) and isolates cert / rate-limit / audit scope from browser
    # traffic. Migration is dual-run: HTTPRoutes for the legacy
    # `<svc>.62a.` hostnames continue to work through their existing
    # `inbox` / `ray-api` sections until callers have moved.
    #
    # TLS: dedicated `wildcard-api-quanianitis-com-tls` secret,
    # issued by the same letsencrypt-prod ClusterIssuer as the 62a
    # wildcard (DNS-01 via Cloudflare on the quanianitis.com zone).
    # See certificate-api.yaml.
    - name: api-https
      protocol: HTTPS
      port: 443
      hostname: "*.api.quanianitis.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: wildcard-api-quanianitis-com-tls
      allowedRoutes:
        namespaces:
          from: All
