# Listener-scoped SecurityPolicy shared across the api-key surface of
# Gateway `public`. Enforces X-API-Key auth at L7 for every route
# attached via `parentRefs[].sectionName: {inbox, ray-api}`.
#
# The name stays `inbox-apikey` for historical reasons; conceptually
# this is "the api-key auth policy for non-browser callers". It
# currently protects two listeners:
#   - inbox   → inbox.62a.quanianitis.com     (Cloudflare Email Worker,
#                                              other webhook consumers)
#   - ray-api → ray-api.62a.quanianitis.com  (Ray dashboard REST API:
#                                              Job Submission, State API)
# Both share the `gateway-api-key` Secret credential set; add a new
# key entry to that Secret when you want a distinct credential for a
# new consumer (all keys in the Secret authenticate equally, but the
# matched key name is forwarded upstream as x-client-id for audit).
#
# Specificity: this SP attaches to Gateway listeners (section), which
# beats the gateway-wide `public-oidc` SP in EG's precedence
# (listener > gateway). public-oidc continues to apply to the `https`
# listener; on `inbox` and `ray-api` it's overridden and gets a
# `PolicyConditionOverridden: true` status pointing to those sections
# - that is expected, see internal/gatewayapi/securitypolicy.go in EG
# source (getOverriddenTargetsMessageForGateway).
#
# Sanitize strips the X-API-Key header before forwarding, so the
# upstream pod never logs the credential. forwardClientIDHeader exposes
# the matched Secret-data key (e.g. `cf-worker`) to the upstream as
# `x-client-id` for audit logging.
#
# Defence-in-depth: any consumer of this listener is free to add its
# own per-pod authn on top (e.g. duitku-webhook enforces HMAC-SHA256
# over the body for replay protection). The edge api-key auth is the
# minimum bar; the pod can choose to require more.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: inbox-apikey
  namespace: gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      sectionName: inbox
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      sectionName: ray-api
  apiKeyAuth:
    credentialRefs:
      # Legacy Secret, kubectl-created out-of-band per the interim
      # workflow in SECRET_ROTATION.md. Retained during the ESO
      # migration so callers already authenticating against the
      # `cf-worker` value (the Cloudflare Email Worker) don't see a
      # 401 window while they are re-pointed at the new value in
      # `gateway-homelab-auth`. Dropped in Phase 4 of the migration,
      # after `wrangler secret put` has updated the CF Worker to
      # present the new value.
      - group: ""
        kind: Secret
        name: gateway-api-key
      # ESO-managed Secret, sourced from 1P item `gateway-homelab-auth`
      # via infra/kustomize/gateway/externalsecret-homelab-auth.yaml.
      # This is the intended end state. Envoy Gateway treats the union
      # of all data keys across every Secret in this list as the valid
      # X-API-Key credential set — whichever value the caller presents,
      # if it matches ANY listed Secret's data-key value, the request is
      # authenticated. `forwardClientIDHeader: x-client-id` reports the
      # matched key NAME upstream (not the value), so requests
      # authenticated via this Secret log `x-client-id: apikey-gateway`
      # and requests via the legacy Secret log `x-client-id: cf-worker`.
      #
      # Precondition: this Secret MUST exist in-cluster before adding
      # it here — Envoy Gateway rejects the whole SecurityPolicy as
      # Accepted=False reason=Invalid on any missing credentialRef, and
      # an Invalid SP fails OPEN (unauthenticated traffic reaches the
      # backend). Verified live: ExternalSecret Ready=SecretSynced,
      # target Secret ownerReferences[0]=ExternalSecret/gateway-homelab-auth.
      - group: ""
        kind: Secret
        name: gateway-homelab-auth
    extractFrom:
      - headers:
          - X-API-Key
    forwardClientIDHeader: x-client-id
    sanitize: true
