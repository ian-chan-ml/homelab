apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gateway

resources:
  - certificate.yaml
  - gateway.yaml
  - gatewayclass.yaml
  - securitypolicy.yaml
  - securitypolicy-inbox.yaml
  - securitypolicy-dex.yaml
  - externalsecret-homelab-auth.yaml
  # The X-API-Key credential for the `inbox` and `ray-api` listeners
  # is now ESO-managed via `externalsecret-homelab-auth.yaml`, sourced
  # from 1P item `gateway-homelab-auth` field `apikey-gateway` in
  # vault `quanianitis.com`. The target Secret `gateway-homelab-auth`
  # is created and refreshed by ExternalSecrets Operator with
  # `creationPolicy: Owner` — do not `kubectl create` or `kubectl
  # apply` it directly.
  #
  # The legacy `gateway-api-key` Secret (kubectl-created out-of-band
  # during the interim rotation workflow described in
  # `infra/kustomize/external-secrets/SECRET_ROTATION.md`) has been
  # retired as of Phase 4. Every prior consumer of the `cf-worker`
  # data-key value has been re-pointed at `apikey-gateway`, the
  # Secret has been deleted from the cluster, and the credentialRef
  # in `securitypolicy-inbox.yaml` no longer names it.
