apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gateway

resources:
  - certificate.yaml
  - gateway.yaml
  - gatewayclass.yaml
  - securitypolicy.yaml
  - securitypolicy-inbox.yaml
  - securitypolicy-dex.yaml
  - externalsecret-homelab-auth.yaml
  # gateway-api-key Secret is intentionally NOT declared in git. It is
  # the LEGACY kubectl-created Secret from the interim rotation
  # workflow; the ESO-managed replacement is `gateway-homelab-auth`,
  # projected by externalsecret-homelab-auth.yaml from 1P item
  # `gateway-homelab-auth`. Both are currently listed in
  # `inbox-apikey.spec.apiKeyAuth.credentialRefs` for a zero-downtime
  # cut-over.
  #
  # Emergency manual rotation of the legacy Secret is still possible
  # via the recipe in
  #   infra/kustomize/external-secrets/SECRET_ROTATION.md
  # but the target end-state is: 1P field `apikey-cf-worker` in item
  # `gateway-homelab-auth` is the source of truth; delete
  # `gateway-api-key` Secret and its credentialRef once the migration
  # is verified.
