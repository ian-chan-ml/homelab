apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: public-oidc
  namespace: gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
  oidc:
    # Dex is the OIDC IdP for this gateway. It federates upstream to
    # Google (see infra/kustomize/dex/values.yaml → connectors[].google)
    # so Google Console only holds one redirect URI now:
    # https://auth.62a.quanianitis.com/callback. Per-hostname
    # /oauth2/callback entries live in Dex's staticClients config in git.
    provider:
      issuer: https://auth.62a.quanianitis.com
    clientIDRef:
      name: dex-client-envoy
    clientSecret:
      name: dex-client-envoy
    cookieDomain: 62a.quanianitis.com
    cookieNames:
      idToken: IdToken
      accessToken: AccessToken
    logoutPath: /logout
    scopes:
      - openid
      - email
      - profile
  jwt:
    providers:
      - name: dex
        issuer: https://auth.62a.quanianitis.com
        remoteJWKS:
          uri: https://auth.62a.quanianitis.com/keys
        extractFrom:
          cookies:
            - IdToken
        claimToHeaders:
          - claim: email
            header: x-auth-email
  authorization:
    defaultAction: Deny
    rules:
      - name: allowlist
        action: Allow
        principal:
          jwt:
            provider: dex
            claims:
              - name: email
                valueType: String
                values:
                  - quanianitis@gmail.com
                  - work@quanianitis.com
                  - main@quanianitis.com
